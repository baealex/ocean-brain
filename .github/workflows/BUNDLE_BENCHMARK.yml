name: BUNDLE BENCHMARK

on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Git ref for the unbundled baseline
        required: true
        type: string
      candidate_ref:
        description: Git ref for the bundled candidate
        required: true
        default: main
        type: string
      trials:
        description: Number of isolated-cache trials per variant
        required: true
        default: '3'
        type: choice
        options:
          - '1'
          - '3'
          - '5'

permissions:
  contents: read

concurrency:
  group: bundle-benchmark-${{ inputs.baseline_ref }}-${{ inputs.candidate_ref }}
  cancel-in-progress: true

jobs:
  pack-cli:
    name: pack ${{ matrix.variant }} CLI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        variant:
          - baseline
          - candidate

    steps:
      - name: Checkout ${{ matrix.variant }}
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.variant == 'baseline' && inputs.baseline_ref || inputs.candidate_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2

      - name: Install pnpm
        run: npm install --global pnpm@10.25.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build publish artifacts
        run: node scripts/release/prepublish.mjs

      - name: Pack CLI
        id: pack
        run: node scripts/ci/pack-cli-tarball.mjs

      - name: Upload ${{ matrix.variant }} tarball
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.variant }}
          path: ${{ steps.pack.outputs.path }}
          if-no-files-found: error
          retention-days: 3

  windows-install:
    name: compare cold install on Windows
    needs: pack-cli
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout benchmark scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2

      - name: Upgrade npm
        run: npm install --global npm@11.11.0

      - name: Download baseline tarball
        uses: actions/download-artifact@v8
        with:
          name: cli-baseline
          path: .artifacts/baseline

      - name: Download bundled tarball
        uses: actions/download-artifact@v8
        with:
          name: cli-candidate
          path: .artifacts/candidate

      - name: Benchmark isolated cold installs
        run: node scripts/ci/benchmark-cli-install.mjs .artifacts/baseline .artifacts/candidate --trials "${{ inputs.trials }}"

      - name: Smoke test bundled npx package
        shell: pwsh
        env:
          CLI_SMOKE_PORT: 16683
        run: |
          $tarball = Get-ChildItem .artifacts/candidate/*.tgz | Select-Object -First 1
          if (-not $tarball) {
            throw 'Bundled CLI tarball was not found.'
          }
          node scripts/ci/smoke-cli-npx.mjs $tarball.FullName
