name: IMAGE SECURITY

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Published image tag to inspect
        required: true
        default: latest
        type: string

permissions:
  contents: read

jobs:
  resolve-image:
    runs-on: ubuntu-latest
    outputs:
      image-ref: ${{ steps.image.outputs.ref }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve immutable image reference
        id: image
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.tag || 'latest' }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]*$ ]]; then
            echo 'Invalid Docker image tag' >&2
            exit 1
          fi
          digest="$(docker buildx imagetools inspect "baealex/ocean-brain:$IMAGE_TAG" | awk '/^Digest:/ { value=$2 } END { print value }')"
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo 'Could not resolve the published image digest' >&2
            exit 1
          fi
          echo "ref=baealex/ocean-brain@$digest" >> "$GITHUB_OUTPUT"

  scan-image:
    needs: resolve-image
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Scan published image
        uses: ./.github/actions/scan-docker-image
        with:
          image-ref: ${{ needs.resolve-image.outputs.image-ref }}
          platform: ${{ matrix.platform }}
          report-name: image-security-${{ matrix.arch }}
