name: RELEASE

on:
  push:
    tags:
      - 'v*'

env:
  IMAGE: baealex/ocean-brain

jobs:
  build-package:
    runs-on: ubuntu-latest
    outputs:
      tarball: ${{ steps.pack.outputs.path }}
      integrity: ${{ steps.integrity.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '^22.23.4'
          registry-url: https://registry.npmjs.org

      - name: Verify release version
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('packages/cli/package.json', 'utf8'));
          if (process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error('Release tag must match the version in packages/cli/package.json');
          }
          NODE

      - name: Install pnpm
        run: npm install -g pnpm@10.25.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & prepare publish
        run: node scripts/release/prepublish.mjs

      - name: Pack CLI package
        id: pack
        run: node scripts/ci/pack-cli-tarball.mjs

      - name: Audit packed CLI installation
        run: node scripts/ci/audit-cli-tarball.mjs "${{ steps.pack.outputs.path }}"

      - name: Record CLI tarball integrity
        id: integrity
        run: |
          integrity="sha512-$(openssl dgst -sha512 -binary "${{ steps.pack.outputs.path }}" | openssl base64 -A)"
          echo "value=$integrity" >> "$GITHUB_OUTPUT"

      - name: Upload CLI tarball
        uses: actions/upload-artifact@v7
        with:
          name: cli-tarball
          path: ${{ steps.pack.outputs.path }}
          if-no-files-found: error
          retention-days: 7

  publish-npm:
    needs: build-package
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '^22.23.4'
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.11.0

      - name: Download CLI tarball
        uses: actions/download-artifact@v8
        with:
          name: cli-tarball
          path: .tmp

      - name: Publish ocean-brain
        run: npm publish "${{ needs.build-package.outputs.tarball }}" --provenance --access public

  verify-npm:
    needs: [build-package, publish-npm]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '^22.23.4'
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for npx verification
        run: npm install -g npm@11.11.0

      - name: Wait for npm package propagation
        shell: bash
        timeout-minutes: 30
        run: |
          for attempt in {1..180}; do
            if npm view "ocean-brain@${{ steps.version.outputs.version }}" version --fetch-retries=0 --fetch-timeout=10000; then
              exit 0
            fi

            echo "npm package is not visible yet ($attempt/180); retrying in 10s..."
            sleep 10
          done

          echo "npm package did not become visible: ocean-brain@${{ steps.version.outputs.version }}" >&2
          exit 1

      - name: Verify published package integrity
        env:
          RELEASE_EXPECTED_INTEGRITY: ${{ needs.build-package.outputs.integrity }}
        run: |
          actual_integrity="$(npm view "ocean-brain@${{ steps.version.outputs.version }}" dist.integrity --fetch-retries=0 --fetch-timeout=10000)"
          if [ "$actual_integrity" != "$RELEASE_EXPECTED_INTEGRITY" ]; then
            echo "Published npm package does not match the shared release tarball" >&2
            exit 1
          fi

      - name: Verify published npx package
        run: CLI_SMOKE_PORT=6685 node scripts/ci/smoke-cli-npx.mjs "ocean-brain@${{ steps.version.outputs.version }}"

  publish-docker:
    needs: build-package
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download CLI tarball
        uses: actions/download-artifact@v8
        with:
          name: cli-tarball
          path: .tmp

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .tmp
          file: ./Dockerfile
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            PACKAGE_SPEC=/build/ocean-brain-${{ steps.version.outputs.version }}.tgz
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 7

  publish-docker-manifest:
    needs: publish-docker
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:${{ steps.version.outputs.version }} \
            -t ${{ env.IMAGE }}:latest \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

  verify-docker:
    needs: publish-docker-manifest
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '^22.23.4'

      - name: Verify published Docker image
        run: node scripts/ci/smoke-docker-image.mjs "${{ env.IMAGE }}:${{ steps.version.outputs.version }}"

  create-release:
    needs: [verify-npm, verify-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
